name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      use_from_source:
        description: "Build llama.rn from source (slower, enables all backends)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 'true' (recommended): compile llama.cpp for all CPU/GPU backends, like
      # the release workflow. 'false': use the prebuilt .so from llama.rn.
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: ${{ inputs.use_from_source || 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Create .env (DRS AI, fully isolated)
        run: |
          cat > .env << 'EOL'
          APP_URL=drsai://app

          # Feature Flags — DRS AI ships fully isolated (no Drshub / no auth)
          ENABLE_DRSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          EOL

      - name: Create google-services.json (build placeholder)
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "drs-ai-app",
              "storage_bucket": "drs-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.drsai.app" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyA-PLACEHOLDER-0000000000000000000" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOL

      - name: Derive the rnllama variant allowlist
        if: env.ORG_GRADLE_PROJECT_rnllamaBuildFromSource == 'true'
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_RELEASE_STORE_PASSWORD: ${{ secrets.APP_RELEASE_STORE_PASSWORD }}
          APP_RELEASE_KEY_PASSWORD: ${{ secrets.APP_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleProdRelease --no-daemon --stacktrace 2>&1 | tee android-build.log | tail -40

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          ls -lh "$APK"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRS-AI-android-apk
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          retention-days: 30
