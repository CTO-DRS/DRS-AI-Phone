name: Android APK Build

# Needed for the Release-creation step: the default GITHUB_TOKEN is
# read-only unless contents:write is granted explicitly.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      use_from_source:
        description: "Build llama.rn from source (slower, enables all backends)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 'true' (recommended): compile llama.cpp for all CPU/GPU backends, like
      # the release workflow. 'false': use the prebuilt .so from llama.rn.
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: ${{ inputs.use_from_source || 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h / | tail -1
          # NDK: keep only the version this build aligns on
          if [ -d /usr/local/lib/android/sdk/ndk ]; then
            for d in /usr/local/lib/android/sdk/ndk/*/; do
              case "$(basename "$d")" in
                27.3.13750724) ;;
                *) sudo rm -rf "$d" ;;
              esac
            done
          fi
          # Emulator/system images/tools are not needed for APK packaging
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/extras
          sudo rm -rf /usr/local/lib/android/sdk/tools
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      # 2026-10-08: a history-rewrite replacement pass corrupted one base64
      # substring inside a yarn.lock integrity hash ("Pal" -> "Assistant"
      # inside safe-regex-test's sha512), which made CI fail with EINTEGRITY.
      # The lockfile is fixed at the source; these diagnostics plus the
      # retry below keep a spurious runner-side failure from blocking builds.
      - name: Registry integrity diagnostics
        run: |
          echo "--- yarn config (runner env) ---"
          yarn config list || true
          echo "--- direct tarball hash as seen from this runner ---"
          curl -fsSL "https://registry.yarnpkg.com/safe-regex-test/-/safe-regex-test-1.1.0.tgz" -o /tmp/srt.tgz \
            && echo "runner sha512: $(openssl dgst -sha512 -binary /tmp/srt.tgz | openssl base64 -A)" \
            || echo "curl download failed"
          echo "expected      : x/+Cz4YrimQxQccJf5mKEbIa1NzeCRNI5Ecl/ekmlYaampdNLPalVyIcCZNNH3MvmqBugV5TMYZXv0ljslUlaw=="

      - name: Install dependencies
        run: |
          if ! yarn install --frozen-lockfile; then
            echo "::warning::Primary install failed (see diagnostics above). Retrying with --update-checksums"
            yarn install --update-checksums
            if git diff --quiet -- yarn.lock; then
              echo "yarn.lock unchanged after retry -> the first failure was spurious (runner environment); build continues"
            else
              echo "::warning::yarn.lock changed during retry:"
              git diff -- yarn.lock | head -80
            fi
          fi

      - name: Create .env (DRS AI, fully isolated)
        run: |
          cat > .env << 'EOL'
          APP_URL=drsai://app

          # Feature Flags — DRS AI ships fully isolated (no Drshub / no auth)
          ENABLE_DRSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          EOL

      - name: Create google-services.json (build placeholder)
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "drs-ai-app",
              "storage_bucket": "drs-ai-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.drsai.app" }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyA-PLACEHOLDER-0000000000000000000" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOL

      - name: Derive the rnllama variant allowlist
        if: env.ORG_GRADLE_PROJECT_rnllamaBuildFromSource == 'true'
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/drsai-release-key.keystore
          test -s android/app/drsai-release-key.keystore
          ls -la android/app/drsai-release-key.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          APP_RELEASE_STORE_PASSWORD: ${{ secrets.APP_RELEASE_STORE_PASSWORD }}
          APP_RELEASE_KEY_PASSWORD: ${{ secrets.APP_RELEASE_KEY_PASSWORD }}
          # Metro (JS bundler) needs more heap than Node's ~2GB default
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -uo pipefail
          # -Parm64Only=true drops the emulator-only x86_64 .so files (~28MB) from
          # the downloadable APK: big files get truncated on phones and install
          # as "package appears to be invalid". Emulator/e2e builds elsewhere do
          # NOT set it, so they keep x86_64.
          ./gradlew assembleProdRelease -Parm64Only=true -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace 2>&1 | tee android-build.log
          EXIT=$?
          tail -200 android-build.log || true
          exit $EXIT

      - name: Upload build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/android-build.log
          retention-days: 14

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          ls -l "$APK"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | head -14
          echo "--- SHA256 ---"
          sha256sum "$APK"

      - name: Verify APK structure (zipalign + arm64-only)
        run: |
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          # 4-byte alignment of uncompressed resources.arsc is REQUIRED for
          # targetSdk>=30; if broken, Android 11+ rejects the install with
          # "package appears to be invalid".
          "$BUILD_TOOLS/zipalign" -c 4 "$APK"
          echo "zipalign check: OK"
          if unzip -l "$APK" 'lib/x86_64/*' | grep -q 'lib/x86_64/'; then
            echo "::error::x86_64 libs leaked into the arm64-only release APK"
            exit 1
          fi
          echo "ABI check: arm64-only OK"

      - name: Export checksums for release notes
        run: |
          APK=android/app/build/outputs/apk/prod/release/app-prod-release.apk
          SIZE=$(stat -c%s "$APK")
          {
            echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
            echo "APK_SIZE_BYTES=${SIZE}"
            echo "APK_SIZE_MB=$(awk "BEGIN{printf \"%.1f\", ${SIZE}/1048576}")"
          } >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRS-AI-android-apk
          path: android/app/build/outputs/apk/prod/release/app-prod-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rename APK with version
        run: |
          VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          echo "Building DRS-AI-v${VERSION}.apk"
          cp android/app/build/outputs/apk/prod/release/app-prod-release.apk "DRS-AI-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -la DRS-AI-v*.apk

      - name: Create GitHub Release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "DRS AI v${{ env.VERSION }}"
          files: DRS-AI-v*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DRS AI v${{ env.VERSION }}

            ملف APK موقّع بنفس شهادة الإصدار، يثبّت مباشرة فوق النسخ السابقة.

            ### المتطلبات
            - أندرويد 7.0 أو أحدث
            - معالج 64 بت (ARM64) — جميع الهواتف الحديثة
            - مساحة تخزين فارغة لا تقل عن 400MB

            ### التحقق من اكتمال التنزيل قبل التثبيت
            - الحجم الصحيح للملف: **${{ env.APK_SIZE_BYTES }}** بايت (≈ ${{ env.APK_SIZE_MB }} ميجابايت)
            - SHA-256: `${{ env.APK_SHA256 }}`

            إن ظهرت رسالة «لم يتم تثبيت التطبيق لأن الحزمة غير صالحة» فالسبب في الغالب أن التنزيل لم يكتمل أو تغيّر أثناء النقل، وليس خللًا في الملف: أعد التنزيل عبر شبكة مستقرة، وتأكد من حجم الملف قبل التثبيت. هذا الإصدار أصغر بنحو 25% بعد إزالة مكتبات المحاكي (x86_64) غير اللازمة للهواتف.
