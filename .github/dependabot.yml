# Dependabot keeps dependencies fresh and surfaces known CVEs as PRs.
# Weekly cadence: grouped PRs stay reviewable without alert fatigue.

version: 2

updates:
  # JS dependencies (yarn.lock is read automatically for the npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      js-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used across .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Ruby gems for fastlane lanes. DEP-02 (audit v1.41.0): the single Gemfile
  # lives at the repository root (used by both the android and ios fastlane
  # lanes); the previous /android + /ios entries pointed at directories with
  # no Gemfile, so both bundler update jobs failed on every weekly run.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
