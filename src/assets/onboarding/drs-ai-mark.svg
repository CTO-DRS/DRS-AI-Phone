<svg width="112" height="112" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headGrad" x1="16" y1="26" x2="96" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF1FB"/>
      <stop offset="1" stop-color="#DDE3F6"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="26" y1="40" x2="86" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241A54"/>
      <stop offset="1" stop-color="#0B0820"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="50" y1="10" x2="62" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5DBF0"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#9ED4FF"/>
      <stop offset="0.55" stop-color="#4AA3FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="antennaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="56" cy="99" rx="27" ry="4.5" fill="#0B0820" fill-opacity="0.22"/>

  <!-- antenna glow + stem + ball -->
  <circle cx="56" cy="15" r="15" fill="url(#antennaGlow)"/>
  <rect x="53.4" y="20" width="5.2" height="12" rx="2.6" fill="#C9D0EA"/>
  <circle cx="56" cy="16" r="6.4" fill="url(#ballGrad)" stroke="#C3CBEA" stroke-width="0.8"/>

  <!-- ear pods -->
  <rect x="9" y="46" width="11" height="24" rx="5.5" fill="#CDD4EC"/>
  <rect x="92" y="46" width="11" height="24" rx="5.5" fill="#CDD4EC"/>
  <rect x="11.5" y="49" width="6" height="18" rx="3" fill="#B7C0E2"/>
  <rect x="94.5" y="49" width="6" height="18" rx="3" fill="#B7C0E2"/>

  <!-- head shell -->
  <rect x="16" y="26" width="80" height="66" rx="26" fill="url(#headGrad)" stroke="#C3CBEA" stroke-width="1"/>
  <path d="M30 30.5 Q56 25.5 82 30.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- visor -->
  <rect x="26" y="40" width="60" height="36" rx="16" fill="url(#visorGrad)"/>
  <rect x="27.5" y="41.5" width="57" height="33" rx="14.5" stroke="#5D6BC9" stroke-opacity="0.35" stroke-width="1" fill="none"/>

  <!-- eyes: glow halos + cores -->
  <circle cx="43" cy="58" r="11.5" fill="url(#eyeGlow)"/>
  <circle cx="69" cy="58" r="11.5" fill="url(#eyeGlow)"/>
  <circle cx="43" cy="58" r="7.2" fill="url(#eyeGrad)"/>
  <circle cx="69" cy="58" r="7.2" fill="url(#eyeGrad)"/>
  <circle cx="40.8" cy="55.6" r="2" fill="#D9EFFF" fill-opacity="0.9"/>
  <circle cx="66.8" cy="55.6" r="2" fill="#D9EFFF" fill-opacity="0.9"/>
</svg>
